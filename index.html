<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#000000">
<title>velocify v2</title>
<link rel="icon" href="data:,">
<style>
:root{--bg:#000000;--surface:#dbeaff;--border:#ffffff;color-scheme:dark}
html,body{margin:0;width:100%;height:100%;background:var(--bg) url("wallpaper.png") center/cover no-repeat fixed}
.taskbar{position:fixed;left:50%;bottom:12px;width:min(560px,calc(100vw - 28px));height:48px;transform:translateX(-50%);background:color-mix(in srgb,var(--surface) 12%,transparent);border:1px solid color-mix(in srgb,var(--border) 18%,transparent);border-radius:15px;box-shadow:0 8px 24px color-mix(in srgb,var(--bg) 26%,transparent);backdrop-filter:blur(18px) saturate(130%);-webkit-backdrop-filter:blur(18px) saturate(130%)}
</style>
</head>
<body><div class="taskbar" role="toolbar" aria-label="taskbar"></div></body>
</html>
