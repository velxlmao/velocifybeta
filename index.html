<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#000000">
<title>velocify v2</title>
<link rel="icon" href="data:,">
<link rel="stylesheet" href="fonts/body.css">
<style>
:root{--bg:#000000;--surface:#dbeaff;--border:#ffffff;--text:#ffffff;--muted:#cbd6e8;color-scheme:dark}
html,body{margin:0;width:100%;height:100%;background:var(--bg) url("wallpaper.png") center/cover no-repeat fixed}
.taskbar{position:fixed;left:50%;bottom:12px;width:min(680px,calc(100vw - 28px));height:48px;transform:translateX(-50%);background:color-mix(in srgb,var(--surface) 12%,transparent);border:1px solid color-mix(in srgb,var(--border) 18%,transparent);border-radius:15px;box-shadow:0 8px 24px color-mix(in srgb,var(--bg) 26%,transparent);backdrop-filter:blur(18px) saturate(130%);-webkit-backdrop-filter:blur(18px) saturate(130%)}
.start-button{position:absolute;left:7px;top:5px;width:38px;height:38px;padding:0;display:grid;place-items:center;overflow:hidden;color:var(--text);background:transparent;border:0;border-radius:10px;cursor:pointer;transition:background .18s ease,transform .18s ease}
.start-button img{display:block;width:28px;height:28px;object-fit:cover;object-position:center;transition:transform .18s ease,filter .18s ease}
.start-button:hover{background:color-mix(in srgb,var(--surface) 16%,transparent);transform:translateY(-2px)}
.start-button:hover img{transform:scale(1.08);filter:drop-shadow(0 3px 8px color-mix(in srgb,var(--surface) 48%,transparent))}
.start-button:focus-visible,.window-close:focus-visible{outline:2px solid var(--text);outline-offset:2px}
.start-button:active{transform:translateY(0) scale(.94)}
.clock{position:absolute;top:0;right:12px;height:100%;display:flex;flex-direction:column;align-items:flex-end;justify-content:center;gap:2px;color:var(--text);font:600 10px/1.2 Montserrat,sans-serif;font-variant-numeric:tabular-nums;text-shadow:0 1px 3px var(--bg)}
.start-window{position:fixed;left:50%;bottom:76px;width:min(430px,calc(100vw - 28px));height:260px;box-sizing:border-box;overflow:hidden;color:var(--text);background:color-mix(in srgb,var(--bg) 58%,transparent);border:1px solid color-mix(in srgb,var(--border) 22%,transparent);border-radius:7px;box-shadow:0 20px 48px color-mix(in srgb,var(--bg) 44%,transparent);backdrop-filter:blur(20px) saturate(125%);-webkit-backdrop-filter:blur(20px) saturate(125%);transform:translateX(-50%);transform-origin:center}
.start-window[hidden]{display:none}
.window-titlebar{height:34px;display:flex;align-items:center;padding-left:12px;background:color-mix(in srgb,var(--surface) 10%,transparent);border-bottom:1px solid color-mix(in srgb,var(--border) 14%,transparent);font:600 11px/1 Montserrat,sans-serif;user-select:none;cursor:move;touch-action:none}
.window-close{position:absolute;top:0;right:0;width:42px;height:34px;padding:0;color:var(--text);background:transparent;border:0;border-radius:0;font:400 20px/1 Montserrat,sans-serif;cursor:pointer;transition:background .18s ease}
.window-close:hover{background:color-mix(in srgb,var(--surface) 18%,transparent)}
.window-close:active{background:color-mix(in srgb,var(--surface) 10%,transparent)}
.window-content{height:calc(100% - 35px);display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center}
.start-window h1{margin:0 0 12px;font:700 44px/.95 Montserrat,sans-serif;letter-spacing:-1.5px}
.start-window p{margin:0;color:var(--muted);font:600 16px/1.4 Montserrat,sans-serif}
</style>
</head>
<body><section class="start-window" role="dialog" aria-labelledby="start-title" hidden><header class="window-titlebar">velocify<button class="window-close" type="button" aria-label="close">×</button></header><div class="window-content"><h1 id="start-title">velocify v2</h1><p>made by velx</p></div></section><div class="taskbar" role="toolbar" aria-label="taskbar"><button class="start-button" type="button" aria-label="open start window" aria-expanded="false"><img src="start-logo.png" alt=""></button><time class="clock"><span class="clock-time"></span><span class="clock-date"></span></time></div><script>const clock=document.querySelector('.clock'),time=clock.querySelector('.clock-time'),date=clock.querySelector('.clock-date'),startButton=document.querySelector('.start-button'),startWindow=document.querySelector('.start-window'),titlebar=document.querySelector('.window-titlebar'),closeButton=document.querySelector('.window-close');let drag,windowAnimation;function updateClock(){const now=new Date();time.textContent=now.toLocaleTimeString([],{hour:'numeric',minute:'2-digit'});date.textContent=now.toLocaleDateString();clock.dateTime=now.toISOString()}function setWindow(open){windowAnimation?.cancel();startButton.setAttribute('aria-expanded',String(open));if(open){startWindow.hidden=false;closeButton.focus()}else startButton.focus();const frames=open?[{opacity:0,scale:.97},{opacity:1,scale:1}]:[{opacity:1,scale:1},{opacity:0,scale:.97}];const animation=startWindow.animate(frames,{duration:180,easing:'ease-out'});windowAnimation=animation;animation.addEventListener('finish',()=>{if(windowAnimation!==animation)return;if(!open)startWindow.hidden=true;windowAnimation=null})}titlebar.addEventListener('pointerdown',event=>{if(event.target===closeButton)return;const rect=startWindow.getBoundingClientRect();drag={x:event.clientX-rect.left,y:event.clientY-rect.top};startWindow.style.left=rect.left+'px';startWindow.style.top=rect.top+'px';startWindow.style.bottom='auto';startWindow.style.transform='none';titlebar.setPointerCapture(event.pointerId)});titlebar.addEventListener('pointermove',event=>{if(!drag)return;const left=Math.min(innerWidth-startWindow.offsetWidth,Math.max(0,event.clientX-drag.x));const top=Math.min(innerHeight-startWindow.offsetHeight,Math.max(0,event.clientY-drag.y));startWindow.style.left=left+'px';startWindow.style.top=top+'px'});titlebar.addEventListener('pointerup',()=>drag=null);startButton.addEventListener('click',()=>setWindow(startWindow.hidden));closeButton.addEventListener('click',()=>setWindow(false));document.addEventListener('keydown',event=>{if(event.key==='Escape'&&!startWindow.hidden)setWindow(false)});updateClock();setInterval(updateClock,1000)</script></body>
</html>
