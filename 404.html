<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#000000">
<title>velocify v2</title>
<link rel="icon" href="data:,">
<style>
:root{--bg:#000000;--surface:#dbeaff;--border:#ffffff;--text:#ffffff;color-scheme:dark}
html,body{margin:0;width:100%;height:100%;background:var(--bg) url("wallpaper.png") center/cover no-repeat fixed}
.taskbar{position:fixed;left:50%;bottom:12px;width:min(680px,calc(100vw - 28px));height:48px;transform:translateX(-50%);background:color-mix(in srgb,var(--surface) 12%,transparent);border:1px solid color-mix(in srgb,var(--border) 18%,transparent);border-radius:15px;box-shadow:0 8px 24px color-mix(in srgb,var(--bg) 26%,transparent);backdrop-filter:blur(18px) saturate(130%);-webkit-backdrop-filter:blur(18px) saturate(130%)}
.clock{position:absolute;top:0;right:12px;height:100%;display:flex;flex-direction:column;align-items:flex-end;justify-content:center;gap:2px;color:var(--text);font:500 11px/1.1 Arial,sans-serif;font-variant-numeric:tabular-nums;text-shadow:0 1px 3px var(--bg)}
</style>
</head>
<body><div class="taskbar" role="toolbar" aria-label="taskbar"><time class="clock"><span class="clock-time"></span><span class="clock-date"></span></time></div><script>const clock=document.querySelector('.clock'),time=clock.querySelector('.clock-time'),date=clock.querySelector('.clock-date');function updateClock(){const now=new Date();time.textContent=now.toLocaleTimeString([],{hour:'numeric',minute:'2-digit'});date.textContent=now.toLocaleDateString();clock.dateTime=now.toISOString()}updateClock();setInterval(updateClock,1000)</script></body>
</html>
